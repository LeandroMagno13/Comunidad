<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo Base -->
  <rect width="1200" height="630" fill="#0F172A"/>
  
  <!-- Patrón de Red / Geometría de Fondo -->
  <g opacity="0.15">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200" stroke="#94A3B8" stroke-width="1"/>
    <path d="M200 0V630M400 0V630M600 0V630M800 0V630M1000 0V630" stroke="#94A3B8" stroke-width="1"/>
  </g>
  
  <!-- Resplandor Azul (Glow) -->
  <circle cx="1000" cy="150" r="300" fill="#2563EB" opacity="0.15" filter="blur(80px)"/>
  
  <!-- Borde Interno -->
  <rect x="20" y="20" width="1160" height="590" rx="12" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Badge Superior -->
  <rect x="80" y="75" width="460" height="40" rx="20" fill="#2563EB" fill-opacity="0.15" stroke="#2563EB" stroke-width="1.5"/>
  <text x="100" y="101" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#60A5FA" letter-spacing="1">LABORATORIO DE INVESTIGACIÓN INSTITUCIONAL</text>
  
  <!-- Título Principal -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="60" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Comunidad Post Singularidad</text>
  
  <!-- Subtítulo -->
  <text x="80" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="600" fill="#60A5FA">Propiedad Colectiva frente a la Inteligencia Artificial</text>
  
  <!-- Bajada Conceptual -->
  <text x="80" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">Investigación y diseño de un patrimonio productivo colectivo como alternativa</text>
  <text x="80" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">estructural frente al desplazamiento laboral tecnológico.</text>
  
  <!-- Divisor -->
  <line x1="80" y1="490" x2="1120" y2="490" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Footer -->
  <text x="80" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#CBD5E1">Universal Basic Assets (UBA)</text>
  <text x="1120" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#64748B" text-anchor="end">comunidadpostsingularidad.org</text>
</svg>
